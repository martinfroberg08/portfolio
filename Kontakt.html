<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <title>Kontakt</title>
</head>

<body>
    <nav class="navbar">
        <div class="nav-container">
            <div class="nav-links-wrapper" id="navLinksWrapper">
                <a href="index.html">Hem</a>
                <a href="Ommig.html">Om mig</a>
                <a href="Projekt.html">Projekt</a>
                <a href="Kontakt.html">Kontakt</a>
                <a href="Cv.html">Cv</a>
            </div>
            <button type="button" class="theme-toggle" data-theme-toggle aria-label="Växla till ljusläge" title="Växla till ljusläge">
                <img src="imagery/lightbulb-regular-full.svg" alt="" aria-hidden="true" />
            </button>
            <button type="button" class="hamburger" id="hamburgerBtn" aria-label="Slå på/av meny" aria-expanded="false">
                <img src="imagery/bars-solid-full (4).svg" alt="" aria-hidden="true" />
            </button>
        </div>
    </nav>

    <main>
        <header class="page-header">
            <h1>Kontakt</h1>
            <p>Vill du veta mer om mina projekt eller jobba tillsammans med mig? Hör gärna av dig.</p>
            <p>Jag svarar snabbt och ser fram emot att prata om nya idéer, praktik eller samarbeten.</p>
        </header>

        <section class="contact-form">
            <h2>Skicka ett meddelande</h2>
            <form action="#" method="post">
                <div class="form-group">
                    <label for="name">Namn</label>
                    <input type="text" id="name" name="name" placeholder="Ditt namn" required />
                </div>

                <div class="form-group">
                    <label for="email">E-post</label>
                    <input type="email" id="email" name="email" placeholder="din@email.se" required />
                </div>

                <div class="form-group">
                    <label for="subject">Ämne</label>
                    <input type="text" id="subject" name="subject" placeholder="Ämne" required />
                </div>

                <div class="form-group">
                    <label for="message">Meddelande</label>
                    <textarea id="message" name="message" rows="5" placeholder="Skriv ditt meddelande här" required></textarea>
                </div>

                <button type="submit">Skicka</button>
            </form>
        </section>
    </main>

    <footer>
        <p>© 2026 Martin Fröberg - Portfolio</p>
    </footer>

    <script src="index.js"></script>
</body>
</html>
