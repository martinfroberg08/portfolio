<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <title>Kontakt</title>
</head>

<body>
    <nav>
        <a href="Ommig.html">Om mig</a>
        <a href="Projekt.html">Projekt</a>
        <a href="Kontakt.html">Kontakt</a>
        <a href="Cv.html">Cv</a>
    </nav>

    <main>
        <header class="page-header">
            <h1>Kontakt</h1>
            <p>Vill du veta mer om mina projekt eller jobba tillsammans med mig? Hör gärna av dig.</p>
            <p>Jag svarar snabbt och ser fram emot att prata om nya idéer, praktik eller samarbeten.</p>
        </header>

        <section class="contact-form">
            <h2>Skicka ett meddelande</h2>
            <form action="#" method="post">
                <label for="name">Namn</label>
                <input type="text" id="name" name="name" placeholder="Ditt namn" required />

                <label for="email">E-post</label>
                <input type="email" id="email" name="email" placeholder="din@email.se" required />

                <label for="subject">Ämne</label>
                <input type="text" id="subject" name="subject" placeholder="Ämne" required />

                <label for="message">Meddelande</label>
                <textarea id="message" name="message" rows="5" placeholder="Skriv ditt meddelande här" required></textarea>

                <button type="submit">Skicka</button>
            </form>
        </section>
    </main>
</body>
</html>
